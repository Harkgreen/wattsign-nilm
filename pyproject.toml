[project]
name = "wattsign-nilm"
version = "0.2.0"
description = "Physics-informed load signatures and causal appliance recognition."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
ml = ["torch>=2.7,<3"]
cpu = ["torch>=2.7,<3"]
cuda = ["torch>=2.7,<3"]
npu = ["torch==2.7.1", "torch-npu==2.7.1.post8; sys_platform == 'linux'", "psutil>=7,<8"]
notebook = ["ipykernel>=6.29", "jupyterlab>=4.2", "ipywidgets>=8.1", "matplotlib>=3.9", "pillow>=10", "mistune>=3", "beautifulsoup4>=4.12", "nbformat>=5.10", "nbclient>=0.10"]
report = ["matplotlib>=3.9", "pillow>=10", "reportlab>=4.4"]

[project.scripts]
wattsign = "wattsign.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wattsign", "src/load_signature_analysis"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "npu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cuda", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
