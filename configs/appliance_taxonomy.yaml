    valid_to: null
    data_use: ignore
    quality_flags:
      - mixed_target_and_nontarget
    reason: A target appliance and a non-target appliance share the channel.
  - dataset: uk_dale
    house_id: 4
    channel_id: channel_6
    raw_label: washing_machine_microwave_breadmaker
    canonical_appliance: mixed_complex_appliances
    semantic_class: ignore
    binary_label: null
    confidence: high
    valid_from: null
    valid_to: null
    data_use: ignore
    quality_flags:
      - multiple_appliances_same_channel
    reason: Multiple complex appliances share the channel.

data_usage_notes:
  - Use the stated resistive-heating target definition for event labels.
  - Use only data_use=main and confidence=high in the primary smoke test.
  - Never use weak labels in the primary test set.
  - Keep every house wholly inside exactly one split.
  - Fit scalers and missing-value statistics on training houses only.
